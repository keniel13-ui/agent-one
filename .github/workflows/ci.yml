name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: pipx run ruff==0.6.9 check --line-length 120 --ignore E731,E741 .
      - name: Shell syntax
        run: bash -n install_schedule.sh
      - name: Tests (no model, no network)
        run: python -m unittest -v
